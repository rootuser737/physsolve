name: Build SciSketch
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2t64 libegl1 libxcomposite1 libxdamage1 libxrandr2 libxtst6
      - run: pip install -r requirements.txt
      - name: Tests (physics + teacher, exports, full GUI)
        env: { QT_QPA_PLATFORM: offscreen, QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox" }
        run: |
          python tests/test_core.py
          python tests/test_export.py
          python tests/test_gui.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2t64 libegl1 libxcomposite1 libxdamage1 libxrandr2 libxtst6
      - name: Install
        run: pip install -r requirements.txt -r requirements-build.txt
      - name: Build
        run: pyinstaller scisketch.spec --noconfirm --clean
      - name: Self-test (Linux/macOS)
        if: runner.os != 'Windows'
        env: { QT_QPA_PLATFORM: offscreen, QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu", SCISKETCH_SELFTEST_OUT: "selftest.json" }
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN="dist/SciSketch.app/Contents/MacOS/SciSketch"; else BIN="dist/SciSketch/SciSketch"; fi
          "$BIN" --selftest || { echo "--- selftest result:"; cat selftest.json || true; exit 1; }
          cat selftest.json
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env: { QT_QPA_PLATFORM: offscreen, QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu", SCISKETCH_SELFTEST_OUT: "selftest.json" }
        run: |
          $p = Start-Process dist/SciSketch/SciSketch.exe -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path selftest.json) { Get-Content selftest.json }
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
      - name: Zip the app
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip ../SciSketch-Windows.zip SciSketch; elif [ "$RUNNER_OS" = "macOS" ]; then ditto -c -k --keepParent SciSketch.app ../SciSketch-macOS.zip; else zip -qr ../SciSketch-Linux.zip SciSketch; fi
      - uses: actions/upload-artifact@v4
        with:
          name: SciSketch-${{ runner.os }}
          path: SciSketch-*.zip
          if-no-files-found: error
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SciSketch-*.zip
